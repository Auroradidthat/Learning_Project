recurring_patterns_flagged:
  - "Describes what's happening accurately but uses non-canonical JavaScript terminology instead of the official term (e.g., 'return' used for what console.log does, i.e. logging/printing, not returning; 'literal expression' instead of 'string literal') — 2 occurrences, lesson 7 Concept 2 demo exercise, same session v32.0.0 (canonical-terminology rule) was added. Not yet a confirmed pattern past one exercise; watch starting Concept 3."
  - "Stops after the trace on debugging exercises without naming the fault (largely resolved as of lesson 4)"
  - "Reassigns an accumulator instead of adding to its running value (e.g. totalValue = binValue * bin, weeklyTotal = sale + sale) — occurred 4 times across lesson 5 (boundary drill and for...of practice). Corrected cleanly each time once flagged; by lesson 5's final exercises was writing the accumulator correctly on first attempt without prompting. No new occurrences in lesson 6. Aurora's explicit revisit request still stands until confirmed resolved."
  - "Confuses break and continue in loop-control debugging exercises — occurred in both directions during Concept 4 of lesson 5 (break used where continue needed, and vice versa in a build exercise). Both correctly diagnosed and fixed with precise fault naming by end of concept."
  - "Names a cause without testing whether the fix produces the required output (2 occurrences, lesson 3)"
  - "Treats a stored variable as a live formula that updates when inputs change (5 occurrences, lesson 2; resolved by end of lesson 2)"
  - "Digit used instead of an already-declared name holding the same value (multiple occurrences across lessons 1-4)"
  - "Output labels drift from the exact required spec while logic is correct (5 occurrences, lessons 1-3)"
  - "Mixes up which variable holds the whole collection vs. the current item vs. the running accumulator in for...of loops (1 occurrence, lesson 5 Concept 3 Exercise 1; resolved on second attempt same exercise)"
  - "When a debugging fix could land in more than one place, fixes by changing the call/argument instead of the actual broken declaration — occurred 3 times in a row in lesson 6 Concept 4 Exercise 3 (default-parameter fixes), each attempt breaking what the call was meant to test even though the number came out right. Resolved once exercises explicitly stated which code elements were fixed vs. changeable (prompted v29.0.0); correct unaided on the next exercise."
  - "For-loop syntax (counter/condition/step) forgotten entirely — one occurrence, lesson 6 final Exercise 3, despite full mastery shown in lesson 5. Needed a complete guided rebuild from scratch. Worth a quick unprompted refresher early in a future lesson if it recurs; not yet a confirmed pattern on one occurrence."
  - "Assigns if/else branches to the wrong condition (discount/no-discount logic backwards relative to the stated policy) — one occurrence, lesson 6 final Exercise 2. Distinct from earlier lesson 4 conditional struggles (which were about output labels, not branch logic); corrected once the trace was walked through explicitly."
  - "Variable naming collision between a function-internal variable and an outer variable of the same name (both called `total`), causing a real runtime error — one occurrence, lesson 6 final Exercise 2. Corrected on the first explanation."

next_action: "Say 'topic 7' to begin Strings & templates."
