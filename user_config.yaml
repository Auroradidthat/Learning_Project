  topic_7_strings_templates:
    concepts:
      - {n: 1, name: "string concatenation with +", status: complete, note: "Ex1, Ex2 correct first try. Ex3 (debugging, missing spaces): trace and fault both correctly named, but initial fix used console.log's comma-separated arguments instead of repairing the + chain — off the exercise's actual constraint; corrected on second attempt to a proper + rewrite. Ex4 (build, three variables): first attempt again used comma-arguments (masked by console.log's automatic inter-argument spacing), then the +-only rewrite had a missing operator (price \" each\") causing a syntax error; correct on third attempt. Pattern: pull toward console.log's comma syntax specifically when an exercise constrains the answer to + concatenation."}
