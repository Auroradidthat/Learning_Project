      - {n: 3, name: "string methods & properties", status: complete, note: "All four exercises correct first attempt — property (.length) vs. method (.toUpperCase()/.toLowerCase()) distinction applied correctly throughout, including Ex4 correctly reading .length off the original string rather than the uppercase result. Fault naming on the debugging exercise (Ex3) used canonical terminology (\"method\") unprompted. One terminology flag on Ex1 was later ruled out of scope — a Build exercise's code answer isn't required to include a description of method, and the flagged remark was incidental commentary, not a requested explanation — prompted v34.0.0 (narrowed Rule 11's flagging scope)."}
      - {n: 4, name: "expressions inside ${}", status: complete, note: "All four exercises correct. Ex2 required one clarifying question (a method referenced without parentheses, e.g. shopName.toUpperCase with no calling syntax) resolved before submission. Ex3 (debugging, + vs * inside an expression) fault named precisely, using canonical term \"expression\" unprompted."}
    final_exercises:
      total: 5
      completed: 5
      note: "Ex1 (build, strings + Lesson 5 loops, targeting the for-loop-syntax watch): needed a full guided rebuild from scratch — commas instead of semicolons, loop counter reusing the fixed scenario variable daysOpen instead of a separate counter, a self-incrementing step written as days = days++ (misunderstanding that ++ already both increments and returns), and a body variable name mismatch (day vs days). This is a second occurrence of the same lapse from Lesson 6 final Ex3 — now a confirmed recurring pattern rather than a one-off. Aurora requested it be folded into Topic 8's warm-up rather than run as a standalone drill. Ex2 (build, strings + Lesson 6 functions, targeting the accumulator watch): accumulator pattern itself (separate initialization then a distinct add-step) was correct on the first attempt both times it was built; first attempt was missing the function call and log line entirely, added correctly once asked for the general form; a voluntary retry with new scenario values was completed fully unaided, including an accurate description of the call/store mechanism. No accumulator-reassignment error occurred this lesson. Ex3 (debugging, strings + Lesson 4 conditionals): fault-naming was correct overall (the two branches' assigned actions were swapped relative to the policy), but a genuine Claude process error occurred mid-exercise — an answer that happened to match the existing buggy code's behavior was confirmed as correct without cross-referencing the stated policy table; caught and corrected two messages later, prompted v35.0.0 (verify-before-stating now requires checking against the spec/policy specifically on debugging exercises, never against the code being debugged). Ex4 (debugging, strings + Lesson 4 switch) and Ex5 (build, all-variables/inline-expression) both solved correctly first attempt, no help needed."
    scenario:
